info:
  name: Search
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/v1/book/search?query=pioneer winter"
  params:
    - name: query
      value: pioneer winter
      type: query
    - name: provider
      value: goodreads
      type: query
      disabled: true
    - name: type
      value: all
      type: query
      disabled: true
    - name: limit
      value: "1"
      type: query
      disabled: true
    - name: language
      value: es
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
