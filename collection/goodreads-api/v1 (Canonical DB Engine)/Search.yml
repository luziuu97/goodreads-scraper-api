info:
  name: Search
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/v1/book/search?query=dont let the forest in&language=es"
  params:
    - name: query
      value: dont let the forest in
      type: query
    - name: provider
      value: goodreads
      type: query
      disabled: true
    - name: type
      value: all
      type: query
      disabled: true
    - name: limit
      value: "1"
      type: query
      disabled: true
    - name: language
      value: es
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
