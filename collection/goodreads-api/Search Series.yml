info:
  name: Search Series
  type: http
  seq: 4

http:
  method: GET
  url: "{{url}}/api/series/search?query=The Empyrean&provider=hardcover"
  params:
    - name: query
      value: The Empyrean
      type: query
    - name: provider
      value: hardcover
      type: query
    - name: limit
      value: "10"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
