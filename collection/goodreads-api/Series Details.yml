info:
  name: Series Details
  type: http
  seq: 5

http:
  method: GET
  url: "{{url}}/api/series/:slug?provider=hardcover"
  params:
    - name: provider
      value: hardcover
      type: query
    - name: limit
      value: "50"
      type: query
      disabled: true
    - name: offset
      value: "0"
      type: query
      disabled: true
    - name: language
      value: original
      type: query
    - name: format
      value: ebook
      type: query
      disabled: true
    - name: slug
      value: percy-jackson-and-the-olympians
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
