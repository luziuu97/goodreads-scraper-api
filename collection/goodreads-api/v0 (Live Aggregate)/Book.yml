info:
  name: Book Details
  type: http
  seq: 3

docs: |
  Path should be book slug, canonical work ID, or ISBN.
  Returns matchedEdition, availableLanguages, and series array (with position, isPrimary, maxPosition, primaryBooksCount).
  Pass language= to select presentation language for title/description/edition.
  Pass editionId= to select a specific edition.
  Pass refresh=true to bypass cache.

http:
  method: GET
  url: "{{url}}/api/book/details/:slug"
  params:
    - name: language
      value: en
      type: query
      disabled: true
    - name: provider
      value: aggregate
      type: query
      disabled: true
    - name: editionId
      value: "30707731"
      type: query
      disabled: true
    - name: refresh
      value: "true"
      type: query
      disabled: true
    - name: slug
      value: "the-alchemist"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
