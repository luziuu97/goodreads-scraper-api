info:
  name: Book Details
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/book/details/:isbn"
  params:
    - name: language
      value: en
      type: query
      disabled: true
    - name: provider
      value: aggregate
      type: query
      disabled: true
    - name: editionId
      value: "30707731"
      type: query
      disabled: true
    - name: isbn
      value: "9783423437714"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Path should be ISBN-13 (or ISBN-10). Not a Hardcover numeric id.
  Returns matchedEdition + availableLanguages. No editions[] or translations[].
  Pass language= to select title/description/edition in that language.
  Use /formats and /covers for the catalog.
