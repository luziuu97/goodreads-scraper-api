  type: http
  seq: 4

docs: |
  Same work, Spanish presentation. Check title, descriptionLanguage, translators,
  matchedEdition.languageCode, and series array with position, maxPosition, primaryBooksCount.

http:
  method: GET
  url: "{{url}}/api/book/details/:slug"
  params:
    - name: language
      value: es
      type: query
    - name: provider
      value: aggregate
      type: query
      disabled: true
    - name: editionId
      value: ""
      type: query
      disabled: true
    - name: refresh
      value: "true"
      type: query
      disabled: true
    - name: slug
      value: "9788496208926"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
