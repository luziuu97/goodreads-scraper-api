info:
  name: Search Series
  type: http
  seq: 7

docs: |
  Returns series, not books. Open details with slug.

http:
  method: GET
  url: "{{url}}/api/series/search"
  params:
    - name: query
      value: Percy Jackson and the Olympians
      type: query
    - name: limit
      value: "10"
      type: query
      disabled: true
    - name: provider
      value: aggregate
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
