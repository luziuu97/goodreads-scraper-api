info:
  name: Book Formats
  type: http
  seq: 6

http:
  method: GET
  url: "{{url}}/api/book/formats/:bookId"
  params:
    - name: language
      value: en
      type: query
      disabled: true
    - name: format
      value: hardcover
      type: query
      disabled: true
    - name: limit
      value: "50"
      type: query
      disabled: true
    - name: bookId
      value: fourth-wing
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
