info:
  name: Book Formats
  type: http
  seq: 6

docs: |
  Edition / format picker. Do not read details.editions.
  format is lowercase: ebook | hardcover | paperback | audiobook | other.
  physical = hardcover + paperback. Build chips from availableLanguages / availableFormats.

http:
  method: GET
  url: "{{url}}/api/book/formats/:slug"
  params:
    - name: language
      value: en
      type: query
      disabled: true
    - name: format
      value: ebook
      type: query
      disabled: true
    - name: limit
      value: "50"
      type: query
      disabled: true
    - name: provider
      value: aggregate
      type: query
      disabled: true
    - name: refresh
      value: "true"
      type: query
      disabled: true
    - name: slug
      value: "9781649374042"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
