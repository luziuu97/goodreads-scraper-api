info:
  name: Series Details
  type: http
  seq: 8

docs: |
  One book per series position by default (language=original).
  Duplicate Goodreads/Hardcover series names are collapsed; prefer the
  Hardcover slug with a position.

http:
  method: GET
  url: "{{url}}/api/series/:slug"
  params:
    - name: language
      value: original
      type: query
      disabled: true
    - name: format
      value: ebook
      type: query
      disabled: true
    - name: limit
      value: "50"
      type: query
      disabled: true
    - name: offset
      value: "0"
      type: query
      disabled: true
    - name: provider
      value: aggregate
      type: query
      disabled: true
    - name: slug
      value: percy-jackson-and-the-olympians
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
