info:
  name: Book Covers
  type: http
  seq: 5

docs: |
  Cover gallery for the same slug/ISBN used on details.
  covers[].format is the book format (hardcover, ebook, …), not the image type.

http:
  method: GET
  url: "{{url}}/api/book/covers/:slug"
  params:
    - name: limit
      value: "20"
      type: query
      disabled: true
    - name: onlyWithCover
      value: "true"
      type: query
      disabled: true
    - name: provider
      value: aggregate
      type: query
      disabled: true
    - name: refresh
      value: "true"
      type: query
      disabled: true
    - name: slug
      value: "9781649374042"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
