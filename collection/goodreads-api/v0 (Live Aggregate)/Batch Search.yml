info:
  name: Batch Search
  type: http
  seq: 9

docs: |
  Prefer one item per ISBN for library imports. Store isbn from each hit.
  HTTP 200 even when some items fail — check results[].success.

http:
  method: POST
  url: "{{url}}/api/book/batch-search"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "items": [
          { "isbn": "9781649374042", "limit": 1 },
          { "isbn": "9788496208926", "language": "es", "limit": 1 },
          { "title": "Foundation", "author": "Isaac Asimov", "limit": 1 }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
