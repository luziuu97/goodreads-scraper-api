info:
  name: Search ISBN
  type: http
  seq: 2

docs: |
  Use type=isbn when the query is an ISBN.
  `language` is ignored for ISBN lookups so a Spanish ISBN still matches
  when the app always sends language=en (and vice versa).

http:
  method: GET
  url: "{{url}}/api/book/search"
  params:
    - name: query
      value: "9781649374042"
      type: query
    - name: type
      value: isbn
      type: query
    - name: language
      value: en
      type: query
      disabled: true
    - name: limit
      value: "5"
      type: query
      disabled: true
    - name: provider
      value: aggregate
      type: query
      disabled: true
    - name: refresh
      value: "true"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
