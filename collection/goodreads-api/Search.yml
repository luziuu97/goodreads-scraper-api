info:
  name: Search
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/book/search?query=fourth+wing"
  params:
    - name: query
      value: fourth wing
      type: query
    - name: provider
      value: hardcover
      type: query
      disabled: true
    - name: type
      value: isbn
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
