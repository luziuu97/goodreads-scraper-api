info:
  name: Book Covers
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/book/covers/:bookId?provider=hardcover"
  params:
    - name: provider
      value: hardcover
      type: query
    - name: limit
      value: "50"
      type: query
      disabled: true
    - name: onlyWithCover
      value: "true"
      type: query
      disabled: true
    - name: bookId
      value: "1662524"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
